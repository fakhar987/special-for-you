<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Question For You ❤️</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', cursive, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow-x: hidden;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
            max-width: 420px;
            width: 100%;
            position: relative;
        }
        .banner-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
            align-items: center;
        }
        button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #yesBtn {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #ff6b81;
        }
        #noBtn {
            background-color: #eccc68;
            color: white;
            position: absolute;
            right: 40px;
        }
        .date-section {
            display: none;
        }
        input[type="datetime-local"], input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 15px 0;
            border: 2px solid #ffb6c1;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }
        .submit-btn {
            background-color: #2ed573;
            color: white;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
        }
        .music-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: white;
            border: 2px solid #ff4757;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- Background Audio: Until I Found You -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://ia801503.us.archive.org/15/items/stephen-sanchez-until-i-found-you/Stephen%20Sanchez%20-%20Until%20I%20Found%20You.mp3" type="audio/mpeg">
    </audio>

    <button class="music-btn" onclick="toggleMusic()" title="Play/Pause Music">🎵</button>

    <!-- Main Proposal Card -->
    <div class="container" id="mainCard">
        <!-- Funny Cat Banner -->
        <img class="banner-img" id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z6Y3d5ZzR0OHZxeXN1M3RndXFveXF2OHB6OHp1czR0OHZxeXN1MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" alt="Funny Cute Cat">
        
        <h1 id="question">Will you be my someone special? 🐱❤️</h1>
        <p>I have a super important question for you...</p>

        <div class="btn-group">
            <button id="yesBtn" onclick="acceptProposal()">YES! 🥰</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😜</button>
        </div>
    </div>

    <!-- Date Planner Screen (After Clicking YES) -->
    <div class="container date-section" id="dateCard">
        <img class="banner-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMHgyNDExN3kwaHJyNzhza3hhczJzNXBybmcyZHBvM3pyaHJjc2E2eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LbfT5qA81zpP3AAbCP/giphy.gif" alt="Happy Cat Dance">
        
        <h1>YAYAYAY! It's a Date! 🎉❤️</h1>
        <p>Aapne haan bol diya! Ab bataiye hum kab aur kahan mil rahe hain?</p>

        <form id="dateForm" onsubmit="sendDate(event)">
            <label style="color: #d63384; font-weight: bold;">Select Date & Time 📅</label>
            <input type="datetime-local" id="dateTime" required>

            <label style="color: #d63384; font-weight: bold;">Favorite Place / Food Idea 🍕</label>
            <input type="text" id="location" placeholder="e.g. Pizza, Coffee, or Beach?" required>

            <button type="submit" class="submit-btn">Lock It In! 🔒✨</button>
        </form>
    </div>

    <!-- Final Thank You Screen -->
    <div class="container date-section" id="finalCard">
        <img class="banner-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3JqNnhscTVydzh2dzdjdnd1cWh5NmIxdG4zbmd2am0wdTR4dzZjdCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/K1tgb1IUeBOQw/giphy.gif" alt="Cute Cat Love">
        <h1>Can't Wait! 🥰✨</h1>
        <p id="finalMsg">Date confirmed! Main wait kar raha hoon. See you soon! ❤️</p>
    </div>

    <script>
        const music = document.getElementById('bgMusic');

        function toggleMusic() {
            if (music.paused) {
                music.play();
            } else {
                music.pause();
            }
        }

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 100);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function acceptProposal() {
            // Auto play "Until I Found You" on click
            music.play().catch(() => console.log("Music play blocked by browser"));

            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('dateCard').style.display = 'block';

            // Trigger Confetti
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        function sendDate(e) {
            e.preventDefault();
            document.getElementById('dateCard').style.display = 'none';
            document.getElementById('finalCard').style.display = 'block';

            // Confetti explosion again
            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.5 }
            });
        }
    </script>
</body>
</html>
